[package]
name = "broodmap-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
description = "wasm-bindgen bindings for rendering StarCraft: Brood War map previews in the browser"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
broodmap = { version = "0.1.0", path = "../broodmap" }
broodmap-analysis = { version = "0.1.0", path = "../broodmap-analysis" }
broodmap-formats = { version = "0.1.0", path = "../broodmap-formats" }
# No default features: `fs` (DirSource) is meaningless in a browser; assets arrive through
# MemorySource via the two-round prefetch. `png` gives Blob-friendly output, `serde` the plan.
broodmap-render = { version = "0.1.0", path = "../broodmap-render", default-features = false, features = [
    "png",
    "serde",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"
# CascStorage: CASC parsing over JS file callbacks. No default features: `fs` doesn't build for
# wasm32, and the files come from the host.
broodcasc = { git = "https://github.com/ShieldBattery/broodcasc", rev = "4c953f89b7e119e19cf0bdca71981e1d5a939de0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Native CascSource, to check loadAssets against a real install (BROODMAP_TEST_SCR_DIR).
broodmap-render = { version = "0.1.0", path = "../broodmap-render", features = ["casc", "png"] }
