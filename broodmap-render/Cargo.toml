[package]
name = "broodmap-render"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
description = "Render StarCraft: Brood War map previews using Remastered assets"

[features]
default = ["fs"]
# DirSource: read extracted assets from a plain directory via std::fs
fs = []
# CascSource/CdnSource: read assets from a SC:R install or Blizzard's CDN via broodcasc.
# broodcasc/cdn is named explicitly so CdnSource survives a dependent turning broodcasc's
# default features off.
casc = ["dep:broodcasc", "broodcasc/cdn"]
# PNG encoding of rendered images
png = ["dep:png"]
# Serialize/Deserialize impls for the render plan (RenderPlan and friends, AssetRequest) — the
# WASM/JS boundary format for external plan executors. WASM-clean.
serde = ["dep:serde"]

[dependencies]
broodmap = { version = "0.2.0", path = "../broodmap" }
broodmap-formats = { version = "0.2.0", path = "../broodmap-formats" }
thiserror = "2.0"
miniz_oxide = "0.8"
broodcasc = { git = "https://github.com/ShieldBattery/broodcasc", rev = "ea3556da602dca09f3b88517296ccb3772524098", optional = true }
png = { version = "0.18", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
assert_ok = "1.0"
serde_json = "1"
