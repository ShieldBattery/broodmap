[package]
name = "broodmap-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
broodmap = { version = "0.1.0", path = "../broodmap" }
broodmap-render = { version = "0.1.0", path = "../broodmap-render", features = ["casc", "png"] }
# Used directly (not just through broodmap-render's CascSource) by the hidden
# `gen-minimap-tables` subcommand, which reads classic VX4EX/VR4/WPE tileset files that have no
# `AssetRequest` variant (they're dev-time-only inputs to the minimap table generator, never read
# at render time) -- same pinned revision broodmap-render's `casc` feature uses. `cdn-http`
# supplies the ureq transport (plus the fs-feature CachingTransport) behind `--cdn`.
broodcasc = { git = "https://github.com/ShieldBattery/broodcasc", rev = "4c953f89b7e119e19cf0bdca71981e1d5a939de0", features = ["cdn-http"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
